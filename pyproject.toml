[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sme-bacnet-sim"
dynamic = ["version"]
description = "SME BACnetSim: a free BACnet/IP device simulator with a web UI"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
keywords = ["bacnet", "bacnet-ip", "bacnet-simulator", "simulator", "emulator", "building-automation", "bms", "ems", "bacpypes3"]
classifiers = [
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Home Automation",
]
dependencies = [
  "bacpypes3>=0.0.102",
  # Shared web shell, standard routes, behaviors, templates, xlsx and CLI helpers (FastAPI, uvicorn, PyYAML,
  # python-multipart come with it).
  "sme-sim-common[xlsx]>=1.0,<2",
  "uvicorn[standard]>=0.29",
]

[project.urls]
Homepage = "https://github.com/smartedge-tech-dev/sme-bacnet-sim"
Documentation = "https://smartedge-tech-dev.github.io/sme-bacnet-sim/"
Changelog = "https://github.com/smartedge-tech-dev/sme-bacnet-sim/blob/main/CHANGELOG.md"

[project.scripts]
sme-bacnet-sim = "sme_bacnet_sim.__main__:main"

[tool.setuptools.dynamic]
version = { attr = "sme_bacnet_sim.__version__" }

[tool.setuptools.packages.find]
include = ["sme_bacnet_sim*"]

[tool.setuptools.package-data]
sme_bacnet_sim = ["static/**/*"]
