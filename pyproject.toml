[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sme-bacnet-sim"
dynamic = ["version"]
description = "SME BACnetSim: a free BACnet/IP device simulator with a web UI"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
keywords = ["bacnet", "simulator", "building-automation", "bacpypes3"]
classifiers = [
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Home Automation",
]
dependencies = [
  "bacpypes3>=0.0.102",
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29",
  "pyyaml>=6.0",
  "python-multipart>=0.0.9",
  "openpyxl>=3.1",
]

[project.urls]
Homepage = "https://github.com/smartedge-tech-dev/sme-bacnet-sim"

[project.scripts]
sme-bacnet-sim = "sme_bacnet_sim.__main__:main"

[tool.setuptools.dynamic]
version = { attr = "sme_bacnet_sim.__version__" }

[tool.setuptools.packages.find]
include = ["sme_bacnet_sim*"]

[tool.setuptools.package-data]
sme_bacnet_sim = ["static/**/*"]
