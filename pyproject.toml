[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sme-bacnet-sim"
dynamic = ["version"]
description = "SME BACnetSim: a free BACnet/IP device simulator with a web UI"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
keywords = ["bacnet", "simulator", "building-automation", "bacpypes3"]
classifiers = [
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Home Automation",
]
dependencies = [
  "bacpypes3>=0.0.102",
  # Shared web shell, standard routes, behaviors, templates, xlsx and CLI helpers (FastAPI, uvicorn, PyYAML,
  # python-multipart come with it). Pre-release pin while sme-sim-common is unpublished; change to
  # ">=1.0,<2" once 1.0.0 is on PyPI (before the 0.5.0 release).
  "sme-sim-common[xlsx]>=1.0.0.dev0,<2",
  "uvicorn[standard]>=0.29",
]

[project.urls]
Homepage = "https://github.com/smartedge-tech-dev/sme-bacnet-sim"

[project.scripts]
sme-bacnet-sim = "sme_bacnet_sim.__main__:main"

[tool.setuptools.dynamic]
version = { attr = "sme_bacnet_sim.__version__" }

[tool.setuptools.packages.find]
include = ["sme_bacnet_sim*"]

[tool.setuptools.package-data]
sme_bacnet_sim = ["static/**/*"]
