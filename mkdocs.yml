site_name: SME BACnetSim
site_url: https://smartedge-tech-dev.github.io/sme-bacnet-sim/
site_description: Free, open-source BACnet/IP device simulator (BACnet server emulator) with a live web UI for Windows, Linux and Docker. Test a BMS, EMS or gateway without real BACnet devices.
repo_url: https://github.com/smartedge-tech-dev/sme-bacnet-sim
repo_name: smartedge-tech-dev/sme-bacnet-sim
docs_dir: docs

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - search.highlight
    - content.code.copy

plugins:
  - search
  - i18n:
      docs_structure: folder
      reconfigure_material: true
      reconfigure_search: true
      languages:
        - locale: en
          default: true
          name: English
          build: true
        - locale: ja
          name: 日本語
          build: true
          site_description: 無料・オープンソースの BACnet/IP デバイスシミュレータ。Windows / Linux / Docker で動作し、実機なしで BEMS・EMS・ゲートウェイなどの BACnet クライアントを試験できます。
          nav_translations:
            Home: ホーム
            Getting started: はじめに
            Configuration: 設定
            Services and tools: サービスとツール
            Reference: リファレンス
            About: 概要
        - locale: zh
          name: 简体中文
          build: true
          site_description: 免费开源的 BACnet/IP 设备模拟器（BACnet 仿真软件），带实时 Web UI，支持 Windows、Linux 和 Docker。无需真实设备即可测试 BMS、EMS 或网关等 BACnet 客户端。
          nav_translations:
            Home: 首页
            Getting started: 快速入门
            Configuration: 配置
            Services and tools: 服务与工具
            Reference: 参考
            About: 关于

markdown_extensions:
  - admonition
  - tables
  - toc:
      permalink: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences
  - pymdownx.snippets:
      base_path: [.]
      check_paths: true

nav:
  - Home: index.md
  - Getting started:
      - quick-start.md
      - foreign-device.md
  - Configuration:
      - configuration.md
      - objects.md
      - accumulators-loops.md
      - files-programs.md
      - trend-logs.md
      - schedules-calendars.md
      - alarms.md
      - event-enrollments.md
      - life-safety.md
  - Services and tools:
      - device-management.md
      - text-private-transfer.md
      - behaviors-templates.md
      - ede.md
      - excel.md
      - cloning.md
      - copy-paste.md
      - http-api.md
  - Reference:
      - not-supported.md
      - development.md
      - changelog.md
  - About:
      - commercial-support.md
      - license.md
