site_name: SME BACnetSim
site_url: https://smartedge-tech-dev.github.io/sme-bacnet-sim/
site_description: A free, MIT-licensed BACnet/IP device simulator with a live web UI.
repo_url: https://github.com/smartedge-tech-dev/sme-bacnet-sim
repo_name: smartedge-tech-dev/sme-bacnet-sim
docs_dir: docs

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - search.highlight
    - content.code.copy

plugins:
  - search
  - i18n:
      docs_structure: folder
      reconfigure_material: true
      reconfigure_search: true
      languages:
        - locale: en
          default: true
          name: English
          build: true
        - locale: ja
          name: 日本語
          build: true
          nav_translations:
            Getting started: はじめに
            Configuration: 設定
            Services and tools: サービスとツール
            Reference: リファレンス
            About: 概要
        - locale: zh
          name: 简体中文
          build: true
          nav_translations:
            Getting started: 快速入门
            Configuration: 配置
            Services and tools: 服务与工具
            Reference: 参考
            About: 关于

markdown_extensions:
  - admonition
  - tables
  - toc:
      permalink: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences

nav:
  - index.md
  - Getting started:
      - quick-start.md
      - foreign-device.md
  - Configuration:
      - configuration.md
      - objects.md
      - accumulators-loops.md
      - files-programs.md
      - trend-logs.md
      - schedules-calendars.md
      - alarms.md
      - event-enrollments.md
      - life-safety.md
  - Services and tools:
      - device-management.md
      - text-private-transfer.md
      - behaviors-templates.md
      - ede.md
      - copy-paste.md
      - http-api.md
  - Reference:
      - not-supported.md
      - development.md
  - About:
      - commercial-support.md
      - license.md
